<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Habit Tracker</title>
<link rel="icon" type="image/png" href="assets/logo-512.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Habits">
<meta name="description" content="A free, open-source habit tracker: yearly planner, monthly and annual dashboards, streaks, Google sign-in and cloud sync.">
<meta name="theme-color" content="#08121f">
<script>/* apply theme before first paint */(function(){var t;try{t=localStorage.getItem("ht-theme")}catch(e){}if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.dataset.theme=t;document.querySelector('meta[name=theme-color]').content=t==="light"?"#f2f5fa":"#08121f"})()</script>
<meta property="og:type" content="website">
<meta property="og:title" content="Habit Tracker">
<meta property="og:description" content="Plan your year, tick your days, watch your streaks grow. Free and open source.">
<meta property="og:url" content="https://legend0x01.github.io/habit-tracker/">
<meta property="og:image" content="https://legend0x01.github.io/habit-tracker/assets/og.png">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="640">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08121f;--p:#0e1e33;--p2:#12284a;--p3:#163259;--ln:#1a3352;--ln2:#14294a;--ln3:#132b47;--ln4:#1d3a5c;
  --tx:#e6edf6;--tx2:#d5e1ee;--mu:#8ea2bb;--dim:#58708c;--hi:#fff;--ax:#7f95ae;
  --inset:#0a1729;--inset2:#0b1a2e;--bd:#2f5a8c;--bd2:#2a4a72;--focus:#2f6fb0;--sb:#24456e;
  --hdr:rgba(6,14,26,.86);--track:#d9e2ec;--danger:#ff8ea4;--fire:#ffb547;--shadow:#000;--toast:#12284a;
  --g:#22c55e;--r:#f0476a;--c:#1fb5e0;--y:#e8b20e;--v:#7357f6;
  color-scheme:dark;
}
:root[data-theme=light]{
  --bg:#f2f5fa;--p:#fff;--p2:#e9eff7;--p3:#dfe8f3;--ln:#d5dfeb;--ln2:#e3eaf2;--ln3:#e3eaf2;--ln4:#cfdae7;
  --tx:#0f1d31;--tx2:#2b3d56;--mu:#5a6e87;--dim:#8b9db3;--hi:#0a1424;--ax:#6a7e96;
  --inset:#eef3f9;--inset2:#f6f9fc;--bd:#9db4d1;--bd2:#b5c7dc;--focus:#2f7fd0;--sb:#c3d1e2;
  --hdr:rgba(255,255,255,.86);--track:#dbe3ee;--danger:#d4234a;--fire:#e07800;--shadow:#4a5d7840;--toast:#fff;
  --g:#16a34a;--r:#e11d48;--c:#0b98c0;--y:#c99700;--v:#6247e8;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Quicksand',system-ui,-apple-system,Segoe UI,sans-serif;font-size:13px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 18px;background:var(--hdr);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--ln);flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;letter-spacing:.2px;margin-right:auto;display:flex;align-items:center;gap:10px}
.brand small{color:var(--mu);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:2.5px}
.logo{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:conic-gradient(from 200deg,#1aa7c9,#22c06e,#e8b20e,#ec4766,#7357f6,#1aa7c9)}
.logo i{width:12px;height:12px;border-radius:3px;background:var(--bg);display:block}
.yearsw{display:flex;align-items:center;background:var(--p);border:1px solid var(--ln);border-radius:9px;overflow:hidden}
.yearsw button{background:none;border:0;font-size:18px;line-height:1;padding:6px 12px;color:var(--mu)}
.yearsw button:hover{background:var(--p2);color:var(--hi)}
.yearsw select{background:var(--p);border:0;font-weight:700;font-size:15px;padding:5px 2px;-webkit-appearance:none;appearance:none;text-align:center;text-align-last:center;cursor:pointer;outline:none}
.btn{background:var(--p2);border:1px solid var(--ln);border-radius:8px;padding:7px 13px;font-weight:600;font-size:12px;transition:.15s}
.btn:hover{border-color:var(--bd);background:var(--p3)}
a.btn{color:var(--tx);text-decoration:none;display:inline-block}
.btn.pri{background:linear-gradient(135deg,#1a9cc0,#6a52ea);border-color:transparent;color:#fff}
.btn.pri:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 9px;font-size:11px;border-radius:6px}
.btn.danger{color:var(--danger)}
.status{font-size:11px;color:var(--mu);display:flex;align-items:center;gap:6px;white-space:nowrap}
.status::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--dot,#8ea2bb);box-shadow:0 0 8px var(--dot,#8ea2bb)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;padding:12px 18px 0;overflow-x:auto;scrollbar-width:none;max-width:1760px;margin:0 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{background:var(--p);border:1px solid var(--ln);border-bottom:none;color:var(--mu);padding:8px 15px;border-radius:9px 9px 0 0;font-weight:700;white-space:nowrap;font-size:12px;position:relative;transition:.15s}
.tab:hover{color:var(--hi)}
.tab.on{color:var(--hi);background:var(--p2);box-shadow:inset 0 3px 0 var(--tc)}
.tab.now::after{content:'';position:absolute;top:6px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--r)}
main{padding:14px 18px 50px;border-top:1px solid var(--ln);max-width:1760px;margin:0 auto}

/* ---------- panels ---------- */
.panel{background:var(--p);border:1px solid var(--ln);border-radius:9px;padding:12px 14px;min-width:0;box-shadow:0 6px 24px -14px var(--shadow)}
.ph{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;color:var(--tx2);text-align:center;margin:0 0 10px}
.ph small{display:block;text-transform:none;letter-spacing:.2px;color:var(--mu);font-weight:500;margin-top:2px}
.stack{display:flex;flex-direction:column;gap:10px;min-width:0}
.title-card{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:118px}
.title-card .big{font-size:34px;font-weight:500;letter-spacing:.5px}
.title-card .sub{font-size:10px;letter-spacing:2px;color:var(--mu);margin-top:12px;font-weight:700}
.info{width:100%;border-collapse:collapse;font-size:11.5px}
.info td{padding:5px 6px;border-bottom:1px solid var(--ln2)}
.info td:first-child{color:var(--mu);text-align:right;width:52%}
.info td:last-child{text-align:center;font-weight:600}
.info select{background:var(--p2);border:1px solid var(--ln);border-radius:5px;padding:2px 6px;font-weight:700}
.metric{text-align:center;padding:10px}
.metric .ml{font-size:10.5px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--tx2)}
.metric .mv{font-size:26px;font-weight:700;margin-top:6px}
.mv.g{color:var(--g)}.mv.r{color:var(--r)}

/* rings */
.rings{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;align-items:center}
.ring{display:flex;flex-direction:column;align-items:center;gap:4px}
.ring svg{width:84px;height:84px}
.ring .rt{fill:none;stroke:var(--track);stroke-width:7;opacity:.9}
.ring .rv{fill:none;stroke-width:7;stroke-linecap:round;transition:stroke-dasharray .5s}
.ring .rl{font-size:10px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--tx2);text-align:center}
.ring .rp{font-size:12px;font-weight:700;color:var(--mu)}

/* charts */
svg.chart{width:100%;height:auto;display:block}
.gl{stroke:var(--ln4);stroke-width:1;stroke-dasharray:3 4}
.ax{fill:var(--ax);font-size:10px;font-family:Quicksand,sans-serif;font-weight:600}
.axv{fill:var(--tx2);font-size:9.5px;font-family:Quicksand,sans-serif;font-weight:700}
.ln{fill:none;stroke:#22c55e;stroke-width:2.4;filter:drop-shadow(0 0 4px #22c55e88)}
.dot{fill:#22c55e;stroke:var(--p);stroke-width:1.5}
.legend{display:flex;gap:14px;justify-content:center;font-size:11px;color:var(--mu);margin-top:4px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* horizontal bars */
.hb{display:grid;grid-template-columns:86px 1fr;gap:8px;align-items:center;margin:5px 0}
.hbl{font-size:10.5px;color:var(--tx2);text-align:right;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hbt{height:13px;background:var(--inset);border-radius:3px;position:relative;overflow:hidden;display:flex}
.hbf{height:100%;border-radius:3px 0 0 3px;min-width:2px}
.hbr{height:100%;opacity:.35}
.hbv{position:absolute;right:5px;top:0;font-size:9.5px;line-height:13px;font-weight:700;color:#fff;text-shadow:0 0 3px #000}
:root[data-theme=light] .hbv{color:var(--tx);text-shadow:none}
.hbv2{position:absolute;left:5px;top:0;font-size:9.5px;line-height:13px;font-weight:700;color:#06101d}
.empty{color:var(--dim);font-size:11.5px;text-align:center;padding:16px 6px}

/* progress bar */
.bar{height:10px;background:var(--inset);border-radius:3px;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;border-radius:3px}

/* ---------- month dashboard ---------- */
.mgrid{display:grid;grid-template-columns:250px minmax(0,1fr) 280px;grid-template-areas:"title rings top" "info chart streak";gap:10px;margin-bottom:10px}
.a-title{grid-area:title}.a-rings{grid-area:rings}.a-top{grid-area:top}.a-info{grid-area:info}.a-chart{grid-area:chart}.a-streak{grid-area:streak}

.sx{overflow-x:auto;scrollbar-width:thin;scrollbar-color:var(--sb) transparent}
table.trk{border-collapse:separate;border-spacing:0;width:100%;min-width:max-content}
.trk th,.trk td{padding:0;text-align:center;font-size:11px;border-bottom:1px solid var(--ln3);white-space:nowrap}
.trk .hn{position:sticky;left:0;background:var(--p);z-index:3;text-align:left;padding:5px 12px 5px 4px;min-width:150px;max-width:230px;overflow:hidden;text-overflow:ellipsis;font-weight:600;color:var(--tx2)}
.trk thead .hn{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;font-weight:700;vertical-align:middle;text-align:center}
.trk .hg{padding:0 8px;color:var(--mu);font-weight:700;border-right:1px solid var(--ln);position:sticky;left:150px;background:var(--p);z-index:3}
.trk thead .hg{font-size:10px;letter-spacing:1px}
.trk .wkh{color:#fff;font-weight:700;padding:6px 0;font-size:11px;border-right:2px solid var(--p)}
.trk .wd{color:var(--mu);font-size:9.5px;padding:5px 0 0;font-weight:600}
.trk .dn{color:var(--tx2);font-weight:700;padding:2px 0 6px;font-size:10.5px}
.trk .dn span{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:50%}
.trk .dn.tdc span{background:var(--r);color:#fff;box-shadow:0 0 10px #f0476a99}
.trk .tdc{background:rgba(240,71,106,.08)}
.trk td.c{width:25px;min-width:25px;height:26px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.trk .wend{border-right:2px solid var(--ln4)}
.cb{display:inline-block;width:15px;height:15px;border:1.5px solid var(--bc);border-radius:3.5px;vertical-align:middle;transition:transform .12s,background .12s;position:relative;opacity:.85}
.cb.on{background:var(--bc);opacity:1;box-shadow:0 0 9px -2px var(--bc)}
.cb.on::after{content:'';position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
td.c.fut .cb{opacity:.3}
td.c:hover .cb{transform:scale(1.18);opacity:1}
.b0{--bc:#1fb0d4}.b1{--bc:#22c06e}.b2{--bc:#7a5ff8}.b3{--bc:#eab308}.b4{--bc:#ef4466}
.trk .pc{padding:0 6px 0 12px;color:var(--tx2);font-weight:700;border-left:1px solid var(--ln)}
.trk .pb{padding:0 6px;min-width:90px}
.trk .pp{padding:0 6px;font-weight:700;color:var(--mu);min-width:40px}
.trk .ps{padding:0 10px 0 4px;font-weight:700;min-width:40px}
.trk .prh{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;font-weight:700;border-left:1px solid var(--ln);padding:0 10px}
.trk .prh small{display:block;letter-spacing:.3px;text-transform:none;color:var(--mu);font-weight:500;font-size:9.5px;margin-top:2px}
.trk tfoot td{font-weight:700;color:var(--mu);font-size:10px;padding:6px 0;border-bottom:none}
.trk tfoot .hn{color:var(--tx2);font-size:10.5px;letter-spacing:1px;text-transform:uppercase}
.trk .addrow td{border-bottom:none}
.trk .addrow .hn{padding:6px 8px 6px 4px;overflow:visible}
.qa{width:100%;background:var(--inset);border:1px dashed var(--bd2);border-radius:6px;padding:6px 9px;font-size:12px;font-weight:600;outline:none;color:var(--tx);transition:.12s}
.qa::placeholder{color:var(--mu)}
.qa:hover{border-color:var(--bd)}
.qa:focus{border-style:solid;border-color:var(--focus);background:var(--inset2)}
.fire{color:var(--fire)}
.fire.z{color:var(--dim)}

.ogrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:10px;margin-top:10px}
.wtbl{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:8px}
.wtbl th{color:#fff;font-weight:700;padding:6px 4px;font-size:11px}
.wtbl td{padding:5px 6px;text-align:center;border-bottom:1px solid var(--ln2)}
.wtbl td:first-child{text-align:left;color:var(--mu);font-weight:600;white-space:nowrap}
textarea.notes{width:100%;min-height:220px;background:repeating-linear-gradient(var(--p) 0 27px,var(--ln) 27px 28px);border:0;border-radius:4px;resize:vertical;line-height:28px;padding:0 6px;font-size:12.5px;outline:none;color:var(--tx2)}

.wgrid{display:grid;grid-template-columns:250px minmax(0,1fr) 200px;gap:10px;margin-top:10px}
.wcols{display:grid;grid-template-columns:repeat(var(--nb),minmax(140px,1fr));gap:0;overflow-x:auto}
.wcol{border-right:1px solid var(--ln2);display:flex;flex-direction:column;min-width:140px}
.wcol:last-child{border-right:0}
.wch{color:#fff;font-weight:700;text-align:center;padding:6px;font-size:11px;letter-spacing:.4px}
.wrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 9px;border-bottom:1px solid var(--ln2);cursor:pointer;font-size:11.5px;-webkit-tap-highlight-color:transparent}
.wrow:hover{background:var(--p2)}
.wrow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wcf{display:flex;align-items:center;gap:6px;padding:8px 9px;margin-top:auto;font-size:11px;font-weight:700;color:var(--mu)}
.wcf .bar{flex:1;min-width:0}
.wfoot{display:flex;gap:8px;align-items:center;padding:8px 9px;border-top:1px solid var(--ln2)}
.wfoot form{flex:1;min-width:0}
.wrow .wr{display:flex;align-items:center;gap:6px;flex:none}
.wrow .wn{font-size:10.5px;font-weight:700;color:var(--mu)}
.wrow.off{cursor:default;opacity:.55}
.wrow.off:hover{background:none}
.wrow em{font-style:normal;font-size:10px;font-weight:700;color:var(--dim);letter-spacing:.3px}
.wrow.ed{cursor:default}
.cb.part{background:color-mix(in srgb,var(--bc) 35%,transparent);opacity:1}
.wgb{min-width:38px;padding:3px 8px;border-radius:6px;border:1px dashed var(--bd);background:var(--inset);font-size:11px;font-weight:700;color:var(--tx)}
.wgb:hover,.wgb:focus-visible{border-style:solid;border-color:var(--focus);outline:none}
.wgb.zero{color:var(--dim)}
.wgrow{display:flex;align-items:center;gap:8px;margin:12px 0}
.wgrow input{width:64px;text-align:center;background:var(--inset);border:1px solid var(--ln);border-radius:7px;padding:7px;font-size:16px;font-weight:700;outline:none}
.wgrow input:focus{border-color:var(--focus)}
.wgrow .ib{font-size:16px;font-weight:700;border:1px solid var(--ln);width:34px;height:34px}
.scope{border:0;padding:0;margin:8px 0}
.scope legend{font-size:12px;font-weight:700;color:var(--tx2);margin-bottom:4px}
.scope label{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--ln);border-radius:8px;margin:6px 0;font-size:12.5px;cursor:pointer}
.scope label:has(input:checked){border-color:var(--focus);background:var(--p2)}
.scope input{accent-color:var(--focus);margin:0}
.scope small{display:block;color:var(--mu);font-size:11px;font-weight:400}
.wedit{padding:8px 9px;border-top:1px solid var(--ln2)}
.wedit .er{display:flex;gap:6px;align-items:center;margin:4px 0}
.wedit input{flex:1;min-width:0;background:var(--inset);border:1px solid var(--ln);border-radius:6px;padding:6px 9px;font-size:12px;font-weight:600;outline:none}
.wedit input:focus{border-color:var(--focus)}
.ringbox{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px}
.ringbox .ring svg{width:120px;height:120px}

/* ---------- annual ---------- */
.agrid{display:grid;grid-template-columns:230px minmax(0,1fr) 330px;grid-template-areas:"title rings top" "metrics chart top";gap:10px;margin-bottom:10px}
.a-metrics{grid-area:metrics}
table.ann{border-collapse:separate;border-spacing:0;width:100%;min-width:max-content;font-size:11px}
.ann th,.ann td{padding:5px 6px;text-align:center;border-bottom:1px solid var(--ln3);white-space:nowrap}
.ann .hn{position:sticky;left:0;background:var(--p);z-index:2;text-align:left;font-weight:600;min-width:160px;max-width:220px;overflow:hidden;text-overflow:ellipsis;color:var(--tx2)}
.ann thead .hn{text-transform:uppercase;letter-spacing:1.2px;font-weight:700;text-align:center}
.ann .mh{color:#fff;font-weight:700;min-width:66px}
.ann .dl{font-size:9.5px;color:#cfe;font-weight:600;padding:3px}
.ann .ok{color:var(--g)}.ann .no{color:var(--r)}.ann .na{color:var(--dim)}
.ann .tot{background:#1f2f7a;color:#fff;font-weight:700}
.ann .ok b,.ann .no b{font-size:12px;margin-right:4px}
.wa{display:grid;grid-template-columns:230px minmax(0,1fr) 300px;gap:10px;margin-top:10px}
.wa2{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:10px;margin-top:10px}
.donut{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.donut svg{width:190px;height:190px}
.dleg{font-size:11px;display:flex;flex-direction:column;gap:4px;min-width:140px}
.dleg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.dleg span{color:var(--mu);margin-left:4px}

/* ---------- planner ---------- */
.pgrid{display:grid;grid-template-columns:250px minmax(0,1fr);gap:10px;margin-bottom:10px}
table.plan{border-collapse:separate;border-spacing:0;width:100%;min-width:max-content}
.plan th,.plan td{padding:0;text-align:center;border-bottom:1px solid var(--ln3);font-size:11.5px}
.plan th{color:#fff;font-weight:700;padding:7px 4px;font-size:11px}
.plan .hn{position:sticky;left:0;z-index:2;background:var(--p);min-width:220px;text-align:left;padding:3px 6px}
.plan thead .hn{text-transform:uppercase;letter-spacing:1.3px;text-align:center}
.plan .dlr th{font-size:9.5px;font-weight:600;padding:3px;color:#d6eef7}
.plan input{background:transparent;border:1px solid transparent;border-radius:5px;padding:5px 6px;width:100%;font-size:12px;outline:none;transition:.12s}
.plan input:hover{border-color:var(--ln)}
.plan input:focus{border-color:var(--focus);background:var(--inset)}
.plan input[type=number]{width:52px;text-align:center;-moz-appearance:textfield}
.plan input[type=number]::-webkit-inner-spin-button,.plan input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.plan td.zero input{color:var(--dim)}
.plan .tot{background:#3a2d9e;color:#fff;font-weight:700;min-width:64px}
.plan tfoot td{font-weight:700;padding:7px 4px;background:#2a1f80;color:#fff}
.plan tfoot .hn{background:#2a1f80;text-transform:uppercase;letter-spacing:1.2px;text-align:center}
.plan th.hn{color:var(--tx)}

.cdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;background:var(--cc);flex:none}

/* ---------- today ---------- */

}

<body>
<header class="top">
  <div class="brand"><span class="logo"><i></i></span>Habit Tracker <small>Daily · Weekly · Annual</small></div>
  <span id="status" class="status">Loading…</span>
  <button class="btn ghost" data-act="today">Today</button>
  <div class="yearsw"><button data-act="yprev" title="Previous year">‹</button><select id="ysel" aria-label="Year"></select><button data-act="ynext" title="Next year">›</button></div>
  <button class="btn ghost" data-act="backup">Backup</button>
  <button id="installBtn" class="btn ghost hidden" data-act="install" title="Install Habit Tracker on this device">⬇ Install</button>
  <button id="remindBtn" class="btn ghost tbtn" data-act="remind" title="Daily reminder" aria-label="Daily reminder">🔕</button>
  <button id="themeBtn" class="btn ghost tbtn" data-act="theme" title="Switch theme" aria-label="Switch theme"></button>
  <a id="support" class="btn ghost hidden" href="support.html" style="text-decoration:none" title="Support this project">☕ Support</a>
  <div id="acct" class="acct"></div>
</header>
<nav id="tabs" class="tabs"></nav>
<main id="app"><div class="loading"><div class="spin"></div>Loading your tracker…</div></main>
<div id="modal" class="modal hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="merge.js"></script>
<script src="config.js"></script>
<script>
/* ================= constants & helpers ================= */
const $=s=>document.querySelector(s);
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const MS=MONTHS.map(m=>m.slice(0,3));
const WD=["Su","Mo","Tu","We","Th","Fr","Sa"];
const WK=["Week 1","Week 2","Week 3","Week 4","Extra Days"];
const WC=["#1fb0d4","#22c06e","#7a5ff8","#eab308","#ef4466"];
const WH=["#14596c","#1c6643","#4537a6","#83650c","#912a40"];
const QH=["#14596c","#1c6643","#83650c","#912a40"];
const QC=["#1fb0d4","#22c06e","#eab308","#ef4466"];
const PAL=["#1fb5e0","#22c55e","#7a5ff8","#eab308","#f0476a","#14b8a6","#a855f7","#f97316","#3b82f6","#84cc16","#ec4899","#06b6d4"];
const STARTER_C=[["r","Routine","#1fb5e0"],["h","Health","#22c55e"],["l","Learning","#7a5ff8"],["w","Wellbeing","#ec4899"]];
const STARTER=[["Plan my day","all","r"],["Wake up by 6:30 am","all","r"],["Drink 2.5L of water","all","h"],["Stretch for 10 mins","all","h"],["Study for 1 hour","all","l"],["DSA practice (2 problems)","all","l"],["Read 10 pages","all","l"],["Strength training",16,"h"],["Go for a walk / cardio",12,"h"],["Spend time with family","all","w"],["Practice mindfulness","all","w"],["No junk food","all","h"],["No screen 1 hr before sleep","all","r"],["Sleep by 11 pm","all","r"]];
const CAT_SUGGEST=["Health","Fitness","Study","Work","Mind","Home","Social"];
const HEX=/^#[0-9a-f]{6}$/i;
const STARTER_W=["Meal prep","Laundry","Clean my room","Call family","Review my week","Learn something new"];
const LS_KEY="habit-tracker-dark:v1";

const isLeap=y=>(y%4===0&&y%100!==0)||y%400===0;
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const ylen=y=>isLeap(y)?366:365;
const doy=(y,m,d)=>Math.round((Date.UTC(y,m,d)-Date.UTC(y,0,1))/864e5);
const bk=d=>Math.min(4,Math.floor((d-1)/7));
const nb=(y,m)=>dim(y,m)>28?5:4;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pc=p=>Math.round((p||0)*100)+"%";
const cl=v=>Math.max(0,Math.min(1,v||0));
const f1=n=>(+n).toFixed(1);
const uid=p=>p+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const clone=o=>JSON.parse(JSON.stringify(o));
const sum=a=>a.reduce((x,y)=>x+y,0);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function now(){const t=new Date();return{y:t.getFullYear(),m:t.getMonth(),d:t.getDate()}}
const fmtD=(y,m,d)=>`${d} ${MS[m]} ${y}`;
const pcol=p=>p>=1?"#22c55e":p>=.75?"#1fb5e0":p>=.5?"#eab308":p>0?"#f0476a":"#33496a";

/* ================= state ================= */
const years={};
let curY=now().y, view=null, ready=false;

/* guest data lives under LS_KEY; each signed-in account gets its own cache key */
function lsKey(){return user?LS_KEY+":u:"+user.id:LS_KEY}
function readLS(key){try{const o=JSON.parse(localStorage.getItem(key)||"null");return o&&o.years&&typeof o.years==="object"?o.years:{}}catch(e){return{}}}
function loadLocal(){for(const k in years)delete years[k];const o=readLS(lsKey());for(const k in o){if(!/^\d{4}$/.test(k))continue;o[k].year=+k;years[k]=norm(o[k])}}
function saveLocal(){try{localStorage.setItem(lsKey(),JSON.stringify({years}));if(user)localStorage.setItem(lsKey()+":base",JSON.stringify(base))}catch(e){}}
/* base[y] = the last copy of year y this device and the cloud agreed on. Comparing against it tells us
   which edits were made here and which on another device, so both survive a sync. */
let base={};
function loadBase(){base={};try{const o=JSON.parse(localStorage.getItem(lsKey()+":base")||"null");if(o&&typeof o==="object")base=o}catch(e){}}

/* three-way merge (same, sameY, pick, mergeYear…) lives in merge.js */
const narrow=()=>matchMedia("(max-width:760px)").matches;
function defaultView(){const n=now();return curY===n.y?(narrow()?"today":"m"+n.m):"planner"} // phones open on the Today checklist

function norm(Y){ // make sure a year object has every field
  Y.habits=Array.isArray(Y.habits)?Y.habits:[];Y.weekly=Array.isArray(Y.weekly)?Y.weekly:[];
  Y.checks=Y.checks||{};Y.wchecks=Y.wchecks||{};Y.notes=Array.isArray(Y.notes)?Y.notes:Array(12).fill("");
  Y.cats=Array.isArray(Y.cats)?Y.cats.filter(c=>c&&typeof c.id==="string"):[];
  Y.cats.forEach((c,i)=>{c.name=String(c.name??"");if(!HEX.test(c.col))c.col=PAL[i%PAL.length]}); // colours go into style attributes: hex only
  const cids=new Set(Y.cats.map(c=>c.id));
  Y.habits.forEach(h=>{if(!Array.isArray(h.goals)||h.goals.length!==12)h.goals=MS.map((_,m)=>dim(Y.year,m));
    if(typeof h.cat!=="string"||(h.cat&&!cids.has(h.cat)))h.cat=""});
  Y.weekly.forEach(w=>{if(!Array.isArray(w.months)||w.months.length!==12)w.months=Array(12).fill(1);
    w.goals=wGoals(w).map(v=>Math.max(0,Math.min(7,parseInt(v,10)||0)))}); // times per week, per week (see merge.js)
  return Y;
}

/* checks: one '0'/'1' string per habit, one char per day of year */
function isChk(y,hid,i){
  while(i<0){y--;if(!years[y])return false;i+=ylen(y)}
  const s=years[y]?.checks?.[hid];return !!s&&s.charCodeAt(i)===49;
}
function setChk(y,hid,i,v){
  const Y=years[y];let s=Y.checks[hid]||"";const L=ylen(y);
  if(s.length<L)s=s.padEnd(L,"0");
  Y.checks[hid]=s.slice(0,i)+(v?"1":"0")+s.slice(i+1);
}
/* weekly checks: one digit per week slot (k = month*5 + week) = how many times it was done that week */
const wCnt=(y,wid,k)=>{const s=years[y]?.wchecks?.[wid];const c=s?s.charCodeAt(k)-48:0;return c>0&&c<10?c:0};
function setW(y,wid,k,c){const Y=years[y];let s=(Y.wchecks[wid]||"").padEnd(WSLOTS,"0");Y.wchecks[wid]=s.slice(0,k)+String(Math.max(0,Math.min(9,c)))+s.slice(k+1)}
/* weekly goals: w.goals[k] = times per week for that week; 0 skips the week. A month switched off in the Planner has no goal. */
const wdays=(y,m,b)=>b<4?7:dim(y,m)-28; // the "Extra Days" week only has 1-3 days
function wGoal(y,w,k){const m=Math.floor(k/5),b=k%5;if(!+w.months[m]||b>=nb(y,m))return 0;return Math.min(wdays(y,m,b),+wGoals(w)[k]||0)}
const wDone=(y,w,k)=>Math.min(wCnt(y,w.id,k),wGoal(y,w,k));

/* ================= stats ================= */
function refDay(y,m){const n=now();if(y<n.y||(y===n.y&&m<n.m))return dim(y,m);if(y===n.y&&m===n.m)return n.d;return 0}
const isToday=(y,m,d)=>{const n=now();return y===n.y&&m===n.m&&d===n.d};
const habitsIn=(y,m)=>years[y].habits.filter(h=>(+h.goals[m]||0)>0);
const weeklyIn=(y,m)=>years[y].weekly.filter(w=>+w.months[m]);

function dayRatio(y,i){
  while(i<0){y--;if(!years[y])return null;i+=ylen(y)}
  if(!years[y])return null;
  const m=new Date(y,0,1+i).getMonth();const act=habitsIn(y,m);if(!act.length)return null;
  let c=0;for(const h of act)if(isChk(y,h.id,i))c++;return c/act.length;
}
function momentum(y,i){let s=0,n=0;for(let k=0;k<7;k++){const r=dayRatio(y,i-k);if(r!=null){s+=r;n++}}return n?s/n:0}
function streak(y,hid,m,ref){
  if(!ref)return 0;let i=doy(y,m,ref);
  if(isToday(y,m,ref)&&!isChk(y,hid,i))i--;
  const lo=years[y].carry===false?doy(y,m,1):-4000;let c=0;
  while(i>=lo&&c<4000&&isChk(y,hid,i)){c++;i--}
  return c;
}
function monthStats(y,m){
  const n=dim(y,m),s0=doy(y,m,1),ref=refDay(y,m),act=habitsIn(y,m);
  const daily=new Array(n+1).fill(0);
  const rows=act.map(h=>{let c=0;for(let d=1;d<=n;d++)if(isChk(y,h.id,s0+d-1)){c++;daily[d]++}
    const g=+h.goals[m];return{h,c,g,p:g?c/g:0,st:streak(y,h.id,m,ref)}});
  const goal=sum(rows.map(r=>r.g)),done=sum(rows.map(r=>Math.min(r.c,r.g)));
  const wk=[];for(let b=0;b<nb(y,m);b++){const d0=b*7+1,d1=b<4?b*7+7:n;let c=0;for(let d=d0;d<=d1;d++)c+=daily[d];const g=act.length*(d1-d0+1);wk.push({b,d0,d1,c,g,p:g?c/g:0})}
  let dailyP=0,weekP=0,mom=0;
  if(ref&&act.length){dailyP=daily[ref]/act.length;const w=wk[bk(ref)];let c=0;for(let d=w.d0;d<=ref;d++)c+=daily[d];weekP=c/(act.length*(ref-w.d0+1));}
  if(ref)mom=momentum(y,s0+ref-1);
  return{n,s0,ref,act,rows,daily,goal,done,rem:Math.max(0,goal-done),wk,dailyP,weekP,monthP:goal?done/goal:0,mom};
}
function wStats(y,m){
  const act=weeklyIn(y,m),B=nb(y,m),cols=[];
  for(let b=0;b<B;b++){const k=m*5+b;let c=0,g=0;for(const w of act){g+=wGoal(y,w,k);c+=wDone(y,w,k)}cols.push({b,c,g,p:g?c/g:0})}
  const done=sum(cols.map(x=>x.c)),goal=sum(cols.map(x=>x.g));
  return{act,cols,done,goal,rem:Math.max(0,goal-done),p:goal?done/goal:0,B};
}

/* ================= categories ================= */
const catOf=(Y,h)=>h&&h.cat?Y.cats.find(c=>c.id===h.cat)||null:null;
const hcol=(Y,h,fb)=>{const c=catOf(Y,h);return c?c.col:fb};
function catGroups(Y,rows){ // rows ({h,…}) grouped in category order; uncategorised habits last
  if(!Y.cats.length)return[{c:null,rows}];
  const out=Y.cats.map(c=>({c,rows:rows.filter(r=>r.h.cat===c.id)})).filter(g=>g.rows.length);
  const rest=rows.filter(r=>!catOf(Y,r.h));if(rest.length)out.push({c:null,rows:rest});
  return out;
}
function catBars(Y,rows){ // goal completion per category; "" when nothing is categorised
  const gs=catGroups(Y,rows);if(!gs.some(g=>g.c))return"";
  return hbars(gs.map(g=>{const goal=sum(g.rows.map(r=>r.g)),done=sum(g.rows.map(r=>Math.min(r.c,r.g))),p=goal?done/goal:0;
    return{label:g.c?g.c.name||"Untitled":"Other",val:`${done}/${goal} · ${pc(p)}`,frac:p,col:g.c?g.c.col:"#58708c"}}),"");
}
const hnCol=col=>col?` ccol" style="--cc:${col}`:""; // extra class + style for a habit-name cell

/* ================= small UI builders ================= */
function ring(p,label,col,big){const r=big?36:34,C=2*Math.PI*r,v=cl(p);
  return`<div class="ring"><svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="${r}" class="rt"/>${v>0?`<circle cx="42" cy="42" r="${r}" class="rv" stroke="${col}" stroke-dasharray="${f1(v*C)} ${f1(C)}" transform="rotate(-90 42 42)"/>`:""}</svg><div class="rl">${label}</div><div class="rp">${pc(p)}</div></div>`}
function hbars(items,emptyMsg){
  if(!items.length)return`<div class="empty">${emptyMsg}</div>`;
  return items.map(it=>`<div class="hb"><div class="hbl" title="${esc(it.label)}">${esc(it.label)}</div><div class="hbt"><div class="hbf" style="width:${f1(cl(it.frac)*100)}%;background:${it.col}"></div><span class="hbv">${it.val}</span></div></div>`).join("");
}
function sbars(items){ // stacked done + remaining
  if(!items.length)return`<div class="empty">No habits yet</div>`;
  const M=Math.max(1,...items.map(i=>i.a+i.b));
  return items.map(it=>`<div class="hb"><div class="hbl" title="${esc(it.label)}">${esc(it.label)}</div><div class="hbt"><div class="hbf" style="width:${f1(it.a/M*100)}%;background:${it.col}"></div><div class="hbr" style="width:${f1(it.b/M*100)}%;background:${it.col}"></div><span class="hbv">${it.a}${it.b?` · ${it.b}`:""}</span></div></div>`).join("");
}
function smooth(p,lo,hi){
  const c=v=>Math.max(lo,Math.min(hi,v));
  if(p.length<2)return`M${f1(p[0][0])},${f1(p[0][1])}`;
  let d=`M${f1(p[0][0])},${f1(p[0][1])}`;
  for(let i=0;i<p.length-1;i++){const p0=p[i-1]||p[i],p1=p[i],p2=p[i+1],p3=p[i+2]||p2,t=.18;
    d+=` C${f1(p1[0]+(p2[0]-p0[0])*t)},${f1(c(p1[1]+(p2[1]-p0[1])*t))} ${f1(p2[0]-(p3[0]-p1[0])*t)},${f1(c(p2[1]-(p3[1]-p1[1])*t))} ${f1(p2[0])},${f1(p2[1])}`}
  return d;
}
let gid=0;
function lineChart(vals,ref){
  const W=760,H=196,pl=36,pr=12,pt=12,pb=24,n=vals.length,id="ga"+(++gid);
  const x=i=>pl+(n>1?i*(W-pl-pr)/(n-1):0),yv=v=>pt+(1-v)*(H-pt-pb);
  let g="";for(const t of[0,.25,.5,.75,1])g+=`<line x1="${pl}" x2="${W-pr}" y1="${f1(yv(t))}" y2="${f1(yv(t))}" class="gl"/><text x="${pl-7}" y="${f1(yv(t)+3)}" class="ax" text-anchor="end">${t*100}%</text>`;
  for(let i=0;i<n;i++)if(i===0||(i+1)%5===0||i===n-1)g+=`<text x="${f1(x(i))}" y="${H-6}" class="ax" text-anchor="middle">${i+1}</text>`;
  const pts=vals.slice(0,ref).map((v,i)=>[x(i),yv(v)]);let body="";
  if(pts.length){const path=smooth(pts,pt,H-pb);
    body=`<path d="${path} L${f1(pts[pts.length-1][0])},${f1(yv(0))} L${f1(pts[0][0])},${f1(yv(0))} Z" fill="url(#${id})"/><path d="${path}" class="ln"/>`+pts.map(p=>`<circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="2.7" class="dot"/>`).join("");
  }else body=`<text x="${W/2}" y="${H/2}" class="ax" text-anchor="middle">Nothing tracked yet for this month</text>`;
  return`<svg viewBox="0 0 ${W} ${H}" class="chart"><defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#22c55e" stop-opacity=".42"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/></linearGradient></defs>${g}${body}</svg>`;
}
function barChart(items,o={}){ // items:{v,col,lab,top}
  const W=o.W||760,H=o.H||160,pl=8,pr=8,pt=18,pb=20,n=Math.max(1,items.length),bw=(W-pl-pr)/n,M=o.max||Math.max(1,...items.map(i=>i.v));
  let s=`<line x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}" class="gl"/>`;
  items.forEach((it,i)=>{const h=cl(it.v/M)*(H-pt-pb),x=pl+i*bw+bw*.16,w=bw*.68,y=H-pb-h;
    s+=`<rect x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(Math.max(h,it.v>0?1.5:0))}" rx="2" fill="${it.col}"><title>${esc(it.lab)}: ${esc(it.top??it.v)}</title></rect>`;
    if(it.top!=null&&it.top!=="")s+=`<text x="${f1(x+w/2)}" y="${f1(y-4)}" class="axv" text-anchor="middle">${esc(it.top)}</text>`;
    s+=`<text x="${f1(x+w/2)}" y="${H-6}" class="ax" text-anchor="middle">${esc(it.lab)}</text>`});
  return`<svg viewBox="0 0 ${W} ${H}" class="chart">${s}</svg>`;
}
function comboChart(done,goal,col="#22c55e"){ // annual: bars done, goal step line, remaining line
  const W=760,H=250,pl=40,pr=12,pt=14,pb=24,n=12,bw=(W-pl-pr)/n,M=Math.max(1,...goal,...done);
  const yv=v=>pt+(1-v/M)*(H-pt-pb);let s="";
  for(let k=0;k<=4;k++){const v=Math.round(M*k/4);s+=`<line x1="${pl}" x2="${W-pr}" y1="${f1(yv(v))}" y2="${f1(yv(v))}" class="gl"/><text x="${pl-6}" y="${f1(yv(v)+3)}" class="ax" text-anchor="end">${v}</text>`}
  let gp="",rp="";
  for(let i=0;i<n;i++){const x=pl+i*bw,cx=x+bw/2,h=H-pb-yv(done[i]);
    s+=`<rect x="${f1(x+bw*.16)}" y="${f1(yv(done[i]))}" width="${f1(bw*.68)}" height="${f1(Math.max(0,h))}" rx="2" fill="${col}"><title>${MONTHS[i]}: ${done[i]} / ${goal[i]}</title></rect>`;
    if(done[i])s+=`<text x="${f1(cx)}" y="${f1(yv(done[i])-4)}" class="axv" text-anchor="middle">${done[i]}</text>`;
    s+=`<text x="${f1(cx)}" y="${H-6}" class="ax" text-anchor="middle">${MS[i]}</text>`;
    gp+=`${i?"L":"M"}${f1(x+2)},${f1(yv(goal[i]))} L${f1(x+bw-2)},${f1(yv(goal[i]))} `;
    rp+=`${i?"L":"M"}${f1(cx)},${f1(yv(Math.max(0,goal[i]-done[i])))} `;
  }
  s+=`<path d="${gp}" fill="none" stroke="#1fb5e0" stroke-width="1.6" stroke-dasharray="5 3"/><path d="${rp}" fill="none" stroke="#f0476a" stroke-width="1.6" stroke-dasharray="2 3"/>`;
  return`<svg viewBox="0 0 ${W} ${H}" class="chart">${s}</svg><div class="legend"><span><i style="background:${col}"></i>Completed</span><span><i style="background:#1fb5e0"></i>Goal</span><span><i style="background:#f0476a"></i>Remaining</span></div>`;
}
function donut(items){
  const tot=sum(items.map(i=>i.v));
  if(!tot)return`<div class="empty">Tick weekly habits to see the breakdown</div>`;
  const R=80,r=50,cx=90,cy=90;let a=-Math.PI/2,s="";
  const pt=(rad,ang)=>[cx+rad*Math.cos(ang),cy+rad*Math.sin(ang)];
  items.filter(i=>i.v>0).forEach(it=>{const da=it.v/tot*Math.PI*2;
    if(da>=Math.PI*2-1e-6){s+=`<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="${it.col}" stroke-width="${R-r}"/>`;return}
    const a2=a+da,L=da>Math.PI?1:0,[x1,y1]=pt(R,a),[x2,y2]=pt(R,a2),[x3,y3]=pt(r,a2),[x4,y4]=pt(r,a);
    s+=`<path d="M${f1(x1)},${f1(y1)} A${R},${R} 0 ${L} 1 ${f1(x2)},${f1(y2)} L${f1(x3)},${f1(y3)} A${r},${r} 0 ${L} 0 ${f1(x4)},${f1(y4)} Z" fill="${it.col}" style="stroke:var(--p)" stroke-width="1.5"><title>${esc(it.lab)}: ${it.v}</title></path>`;
    if(da>.35){const[tx,ty]=pt((R+r)/2,a+da/2);s+=`<text x="${f1(tx)}" y="${f1(ty+3)}" class="axv" text-anchor="middle" style="fill:#06101d">${it.v}</text>`}
    a=a2});
  s+=`<text x="${cx}" y="${cy-2}" text-anchor="middle" style="fill:var(--tx);font:700 22px Quicksand">${tot}</text><text x="${cx}" y="${cy+14}" text-anchor="middle" class="ax">done</text>`;
  return`<div class="donut"><svg viewBox="0 0 180 180">${s}</svg><div class="dleg">${items.map(i=>`<div><i style="background:${i.col}"></i>${esc(i.lab)}<span>${i.v} · ${tot?Math.round(i.v/tot*100):0}%</span></div>`).join("")}</div></div>`;
}

    <div class="wfoot"><form data-f="wquickadd" data-m="${m}" autocomplete="off"><input class="qa" name="q" maxlength="60" placeholder="＋ Add a weekly habit" title="Type a weekly habit (e.g. Laundry) and press Enter" aria-label="Add a weekly habit"></form>

/* one weekly habit in one week: tick (goal 1) or count up to the goal; in edit mode, the goal button */
function wCell(y,w,k,b){
  const g=wGoal(y,w,k),c=wCnt(y,w.id,k),nm=`<span title="${esc(w.name)}">${esc(w.name)}</span>`;
  if(wEdit)return`<div class="wrow ed">${nm}<button class="wgb${g?"":" zero"}" data-act="wgoal" data-w="${w.id}" data-k="${k}" title="Change the weekly goal" aria-label="${esc(w.name)}: ${g?g+" times":"skipped"} in ${WK[b]}. Change goal">${g?g+"×":"skip"}</button></div>`;
  if(!g)return`<div class="wrow off" title="No goal this week">${nm}<em>SKIP</em></div>`;
  const d=Math.min(c,g),cls=d>=g?" on":d?" part":"";
  return`<div class="wrow" data-w="${w.id}" data-k="${k}" role="button" tabindex="0" aria-label="${esc(w.name)}: ${d} of ${g}">${nm}<span class="wr">${g>1?`<b class="wn">${d}/${g}</b>`:""}<i class="cb b${b}${cls}"></i></span></div>`;
}
const goalTxt=w=>{const vs=[...new Set(wGoals(w).filter((_,k)=>+w.months[Math.floor(k/5)]&&k%5<4))];if(!vs.length)return"—";
  const lo=Math.min(...vs),hi=Math.max(...vs);return lo===hi?(lo?`${lo}× a week`:"skipped"):`${lo}–${hi}× a week`};

/* Today: one-tap checklist for a single day (today by default; ‹ › steps back through this year) */
function viewToday(){
  const y=curY,Y=years[y],n=now(),ti=doy(n.y,n.m,n.d),i=tday==null?ti:Math.max(0,Math.min(ti,tday));
  const dt=new Date(y,0,1+i),m=dt.getMonth(),d=dt.getDate(),b=bk(d);
  const rows=habitsIn(y,m).map(h=>({h,on:isChk(y,h.id,i),st:streak(y,h.id,m,d)}));
  const done=rows.filter(r=>r.on).length,tot=rows.length,p=tot?done/tot:0;
  const label=i===ti?"Today":i===ti-1?"Yesterday":dt.toLocaleDateString(undefined,{weekday:"long"});
  const msg=!tot?"":done===tot?"All done 🎉":`${tot-done} to go`;
  let h=`<div class="tday"><div class="panel tdh">

    <div class="tdt"><div class="tdl">${label}</div><div class="tds">${dt.toLocaleDateString(undefined,{weekday:"long"})}, ${d} ${MONTHS[m]}</div></div>
    <button class="ib tnav" data-act="tday" data-d="1"${i<ti?"":" disabled"} aria-label="Next day" title="Next day">›</button></div>`;
  h+=`<div class="panel tsum"><div class="tbig">${done}<small> / ${tot}</small></div><div class="bar" role="progressbar" aria-valuenow="${Math.round(p*100)}" aria-valuemin="0" aria-valuemax="100" aria-label="Habits done"><i style="width:${f1(p*100)}%;background:${pcol(p)}"></i></div><div class="tmsg">${msg}</div></div>`;

  }
  if(!tot)h+=`<div class="empty">No daily habits for ${MONTHS[m]} yet. Add one below.</div>`;
  h+=`</div><form data-f="quickadd" data-m="${m}" autocomplete="off" style="margin-top:10px"><input class="qa" name="q" maxlength="60" placeholder="＋ Add a habit" aria-label="Add a daily habit"></form></div>`;
  const k=m*5+b,wk=weeklyIn(y,m).filter(w=>wGoal(y,w,k)>0);
  if(wk.length){const wd=sum(wk.map(w=>wDone(y,w,k))),wg=sum(wk.map(w=>wGoal(y,w,k)));
    h+=`<div class="panel"><div class="tgh" style="margin-top:0">${WK[b]} · weekly habits<span>${wd}/${wg}</span></div><div class="tlist">${wk.map(w=>{const g=wGoal(y,w,k),d=wDone(y,w,k),on=d>=g;

function viewAnnual(){

  let qP=0;if(refM>=0){const q=Math.floor(refM/3),qs=ms.slice(q*3,q*3+3),g=sum(qs.map(s=>s.goal));qP=g?sum(qs.map(s=>s.done))/g:0}
  const daysLeft=y===n.y?ylen(y)-doy(y,n.m,n.d)-1:(y<n.y?0:ylen(y));

    const g=sum(per.map(p=>p.g)),c=sum(per.map(p=>Math.min(p.c,p.g)));return{h,per,g,c,p:g?c/g:0,k}});

  if(!hab.length)h+=`<tr><td class="hn"></td><td colspan="16" class="empty">Add habits in the Planner to see your year here.</td></tr>`;

    x.per.forEach((p,m)=>{const S=ms[m];

      h+=met?`<td class="ok"><b>✔</b>${p.c}/${p.g}</td>`:fin?`<td class="no"><b>✘</b>${p.c}/${p.g}</td>`:`<td style="color:var(--tx2)">${p.c}/${p.g}</td>`});

    <div class="panel"><div class="ph">Top 10 weekly habits<small>completed · remaining</small></div>${sbars(wr.map((x,i)=>({label:x.w.name,a:x.c,b:Math.max(0,x.g-x.c),col:PAL[i%PAL.length]})))}</div></div>

/* ================= rendering ================= */
function renderTabs(){
  const n=now(),el=$("#tabs");
  if(!ready||!years[curY]||mode==="auth"||mode==="pending"){el.innerHTML="";return}
  const items=[...(curY===n.y?[["today","Today","#f0476a"]]:[]),["planner","Planner","#7a5ff8"],...MS.map((m,i)=>["m"+i,m,QC[Math.floor(i/3)]]),["annual","Annual","#22c55e"]];
  el.innerHTML=items.map(([v,l,c])=>`<button class="tab${view===v?" on":""}${curY===n.y&&v==="m"+n.m?" now":""}" style="--tc:${c}" data-act="tab" data-v="${v}">${l}</button>`).join("");
}
function renderYearSel(){
  const n=now(),ks=Object.keys(years).map(Number);const lo=Math.min(n.y,curY,...ks)-1,hi=Math.max(n.y,curY,...ks)+2;
  let o="";for(let y=lo;y<=hi;y++)o+=`<option value="${y}"${y===curY?" selected":""}>${y}${years[y]?"":" ·"}</option>`;
  $("#ysel").innerHTML=o;
}
function render(){
  const sc=[...document.querySelectorAll(".sx,.wcols")].map(e=>e.scrollLeft);
  renderTabs();renderYearSel();
  const app=$("#app");
  if(mode==="auth"){app.innerHTML=viewAuth();return}
  if(!ready||mode==="pending"){app.innerHTML=`<div class="loading"><div class="spin"></div>Loading your tracker…</div>`;return}
  const Y=years[curY];
  if(!Y)app.innerHTML=viewSetup();
  else{norm(Y);if(view==="today"&&curY!==now().y)view=defaultView();
    app.innerHTML=view==="planner"?viewPlanner():view==="annual"?viewAnnual():view==="today"?viewToday():viewMonth(+view.slice(1)||0)}
  const els=[...document.querySelectorAll(".sx,.wcols")];
  if(els.length===sc.length)els.forEach((e,i)=>e.scrollLeft=sc[i]);
  else scrollToToday();
}
function scrollToToday(){const t=document.querySelector(".trk th.dn.tdc");const sx=t&&t.closest(".sx");if(sx&&sx.scrollWidth>sx.clientWidth)sx.scrollLeft=Math.max(0,t.offsetLeft-sx.clientWidth/2)}
function toast(msg,ms=2200){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}
function armDel(b,doit){ // first click arms the ✕ button, a second click within 3 s deletes
  if(b.dataset.armed){doit();return}
  b.dataset.armed=1;b.classList.add("armed");b.textContent="Delete?";
  setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.classList.remove("armed");b.textContent="✕"}},3000)}
function setYear(y){curY=y;view=defaultView();render();scrollTo(0,0)}

/* ================= persistence (Supabase + browser cache) =================
   mode: "pending" (checking sign-in) · "auth" (sign-in screen) · "guest" (this browser only) · "cloud" (signed in)
   Each year is one row in public.habit_years (user_id, year, data jsonb). Row-level security keeps rows private. */
const CFG=window.HABIT_CONFIG||{};
const SB_ON=!!(window.supabase&&CFG.supabaseUrl&&CFG.supabaseAnonKey&&!/YOUR_/.test(CFG.supabaseUrl+CFG.supabaseAnonKey));
const sb=SB_ON?window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey):null;
const GUEST_OK=LS_KEY+":guest-ok";
const HAS_UPI=(()=>{let v=String(CFG.upiId||"").trim();if(!v.includes("@"))try{v=atob(v)}catch(e){v=""}return/^[\w.\-]{2,256}@[a-zA-Z]{2,64}$/.test(v.trim())})();
if(HAS_UPI)$("#support").classList.remove("hidden");
let user=null,mode=SB_ON?"pending":"guest",synced=false,chan=null,saving=false,timer=null,retryT=null,pullT=null;const dirty=new Set();

let wEdit=false; // monthly dashboard: weekly habits edit mode
let tday=null; // Today view: day-of-year being shown, null = today
let deleting=false; // account deletion in progress: hold back cloud saves
/* ---------- theme ---------- */
function paintThemeBtn(){const l=document.documentElement.dataset.theme==="light",b=$("#themeBtn");b.textContent=l?"🌙":"☀️";b.title=l?"Switch to dark mode":"Switch to light mode";b.setAttribute("aria-label",b.title)}
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem("ht-theme",t)}catch(e){}
  $('meta[name=theme-color]').content=t==="light"?"#f2f5fa":"#08121f";paintThemeBtn()}
paintThemeBtn();
function setStatus(kind,txt){const el=$("#status");el.style.setProperty("--dot",{cloud:"#22c55e",local:"#eab308",saving:"#1fb5e0",err:"#f0476a",load:"#8ea2bb"}[kind]);el.textContent=txt}
function touch(y=curY){years[y].updatedAt=Date.now();saveLocal();dirty.add(y);
  if(mode!=="cloud"){setStatus("local","Saved in this browser");return}
  setStatus("saving","Saving…");clearTimeout(timer);timer=setTimeout(flush,700)}
function rerender(y){const a=document.activeElement;if(+y===curY){if(!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))render()}else renderYearSel()}
function absorb(y,data){ // fold a cloud copy of year y into this device's copy; returns true if what you see changed
  y=+y;const R=norm(clone(data));R.year=y;const L=years[y];

    habits=STARTER.map(([name,g,k])=>({id:uid("h"),name,cat:ck[k]||"",goals:G(m=>g==="all"?dim(y,m):Math.min(g,dim(y,m)))}));weekly=STARTER_W.map(name=>({id:uid("w"),name,months:G(()=>1),goals:Array(WSLOTS).fill(1)}))}
  years[y]={v:1,year:y,carry,cats,habits,weekly,checks:{},wchecks:{},notes:Array(12).fill(""),updatedAt:Date.now()};
  touch(y);view=y===n.y?(narrow()?"today":"m"+n.m):"planner";if(!habits.length)view="planner";render();
  toast(mode==="copy"?`${y} is ready — habits carried over from ${from}`:`${y} is ready`);
}
function findH(id){return years[curY].habits.find(h=>h.id===id)}

/* ---------- weekly goals: change one week, this week and the ones after, or every week ---------- */
function wSlotNow(y,w){ // the week a goal change starts from when opened from the Planner: this week, else the first active week
  const n=now(),act=k=>+w.months[Math.floor(k/5)]&&k%5<nb(y,Math.floor(k/5));
  if(y===n.y){const k=n.m*5+bk(n.d);if(act(k))return k;for(let i=k+1;i<WSLOTS;i++)if(act(i))return i}
  for(let i=0;i<WSLOTS;i++)if(act(i))return i;return 0}
const wLabel=(k,y=curY)=>`${WK[k%5]} of ${MONTHS[Math.floor(k/5)]}${y!==now().y?" "+y:""}`;
function openWGoal(wid,k){
  const y=curY,w=years[y]?.weekly.find(x=>x.id===wid);if(!w)return;
  const cur=+w.months[Math.floor(k/5)]?wGoal(y,w,k):(+wGoals(w)[k]||1),wl=wLabel(k),m=$("#modal");
  m.classList.remove("hidden");
  m.innerHTML=`<div class="mbox" role="dialog" aria-labelledby="wgT"><h3 id="wgT">Weekly goal · ${esc(w.name||"Untitled")}</h3>
  <p>How many times a week do you want to do it? 0 skips the week.</p>
  <div class="wgrow"><button class="ib" data-act="wgstep" data-d="-1" aria-label="One less">−</button><input type="number" id="wgN" min="0" max="7" value="${cur}" inputmode="numeric" aria-label="Times per week"><button class="ib" data-act="wgstep" data-d="1" aria-label="One more">＋</button><span class="hint">times a week</span></div>
  <fieldset class="scope"><legend>Apply to</legend>
    <label><input type="radio" name="wgS" value="one" checked><span>Only ${wl}<small>Every other week keeps its goal.</small></span></label>
    <label><input type="radio" name="wgS" value="fwd"><span>${wl} and every week after<small>Earlier weeks keep their goal, so past progress doesn't change.</small></span></label>
    <label><input type="radio" name="wgS" value="all"><span>Every week of ${y}<small>Rewrites past weeks too.</small></span></label>
  </fieldset>
  <p class="hint">Months switched off in the Planner stay off. The short "Extra Days" week is capped at its number of days.</p>
  <div class="row"><span style="flex:1"></span><button class="btn" data-act="closem">Cancel</button><button class="btn pri" data-act="wgsave" data-w="${w.id}" data-k="${k}">Save</button></div></div>`;
  const i=$("#wgN");i.focus();i.select();
}
function saveWGoal(wid,k){
  const y=curY,w=years[y]?.weekly.find(x=>x.id===wid);if(!w)return;
  let v=parseInt($("#wgN").value,10);if(isNaN(v))v=0;v=Math.max(0,Math.min(7,v));
  const sc=document.querySelector('input[name="wgS"]:checked')?.value||"one",g=wGoals(w).slice();let n=0;
  for(let i=0;i<WSLOTS;i++){
    if(sc==="one"?i!==k:sc==="fwd"&&i<k)continue;
    const mm=Math.floor(i/5),b=i%5;if(b>=nb(y,mm))continue;
    g[i]=Math.min(v,wdays(y,mm,b));n++}
  w.goals=g;touch(y);$("#modal").classList.add("hidden");render();
  const what=v?`${v}× a week`:"skipped";
  toast(sc==="one"?`${w.name||"Weekly habit"}: ${what} in ${wLabel(k)}`:sc==="fwd"?`${w.name||"Weekly habit"}: ${what} from ${wLabel(k)} on`:`${w.name||"Weekly habit"}: ${what}, every week of ${y}`,3500);
}
function updPlanTotals(){const Y=years[curY];const mt=MS.map((_,m)=>sum(Y.habits.map(h=>+h.goals[m]||0)));
  Y.habits.forEach(h=>{const e=document.getElementById("pt-"+h.id);if(e)e.textContent=sum(h.goals.map(g=>+g||0))});
  mt.forEach((v,m)=>{const e=document.getElementById("pm-"+m);if(e)e.textContent=v});const a=$("#pall");if(a)a.textContent=sum(mt);
  const pcEl=$("#pchart");if(pcEl)pcEl.innerHTML=barChart(mt.map((v,m)=>({v,col:QC[Math.floor(m/3)],lab:MS[m],top:v})),{H:220,W:1100});}

document.addEventListener("click",e=>{
  const cell=e.target.closest("td.c[data-h],.tk[data-h]");
  if(cell){const y=curY,i=+cell.dataset.i,hid=cell.dataset.h;setChk(y,hid,i,!isChk(y,hid,i));touch();render();
    if(cell.classList.contains("tk"))document.querySelector(`.tk[data-h="${hid}"]`)?.focus({preventScroll:true});return} // keep keyboard focus on the row
  const wr=e.target.closest(".wrow[data-w],.tk[data-w]");
  if(wr){const k=+wr.dataset.k,wid=wr.dataset.w,w=years[curY].weekly.find(x=>x.id===wid);if(!w)return;
    const g=wGoal(curY,w,k);if(!g)return;const d=wDone(curY,w,k);
    setW(curY,wid,k,d>=g?0:d+1);touch();render(); // each tap counts one more; past the goal it starts again at 0
    document.querySelector(`${wr.classList.contains("tk")?".tk":".wrow"}[data-w="${wid}"][data-k="${k}"]`)?.focus({preventScroll:true});return}
  const b=e.target.closest("[data-act]");if(!b)return;
  const act=b.dataset.act,Y=years[curY],n=now();
  if(b.tagName==="A")e.preventDefault();
  switch(act){
    case"tab":view=b.dataset.v;if(view==="today")tday=null;render();scrollTo(0,0);if(view[0]==="m")scrollToToday();break;
    case"tday":{const ti=doy(n.y,n.m,n.d),j=Math.max(0,Math.min(ti,(tday??ti)+ +b.dataset.d));tday=j===ti?null:j;render();break}
    case"delacct":deleteAccount();break;
    case"yprev":setYear(curY-1);break;
    case"ynext":setYear(curY+1);break;
    case"goy":setYear(+b.dataset.y);break;
    case"today":curY=n.y;tday=null;view=narrow()?"today":"m"+n.m;render();scrollToToday();break;
    case"signin":signIn();break;
    case"signout":signOut();break;
    case"guest":try{localStorage.setItem(GUEST_OK,"1")}catch(_){}startGuest();break;
    case"newyear":makeYear(curY,b.dataset.mode,+b.dataset.from);break;
    case"addh":{if(Y.habits.length>=50){toast("Up to 50 daily habits");break}
      const h={id:uid("h"),name:"",goals:MS.map((_,m)=>curY===n.y&&m<n.m?0:dim(curY,m))};Y.habits.push(h);touch();render();
      const inp=document.querySelector(`input[data-f="hname"][data-h="${h.id}"]`);if(inp)inp.focus();break}
    case"delh":armDel(b,()=>{Y.habits=Y.habits.filter(h=>h.id!==b.dataset.h);delete Y.checks[b.dataset.h];touch();render()});break;
    case"moveh":{const i=Y.habits.findIndex(h=>h.id===b.dataset.h),j=i+ +b.dataset.d;if(j<0||j>=Y.habits.length)break;[Y.habits[i],Y.habits[j]]=[Y.habits[j],Y.habits[i]];touch();render();break}
    case"fillh":{const h=findH(b.dataset.h);h.goals=MS.map((_,m)=>dim(curY,m));touch();render();break}
    case"fillall":Y.habits.forEach(h=>h.goals=MS.map((_,m)=>(curY===n.y&&m<n.m&&!(+h.goals[m]))?0:dim(curY,m)));touch();render();toast("Every habit set to every day");break;
    case"addw":{const w={id:uid("w"),name:"",months:MS.map((_,m)=>curY===n.y&&m<n.m?0:1),goals:Array(WSLOTS).fill(1)};Y.weekly.push(w);touch();render();const inp=document.querySelector(`input[data-f="wname"][data-w="${w.id}"]`);if(inp)inp.focus();break}
    case"delw":armDel(b,()=>{Y.weekly=Y.weekly.filter(w=>w.id!==b.dataset.w);delete Y.wchecks[b.dataset.w];touch();render()});break;
    case"addc":{if(Y.cats.length>=20){toast("Up to 20 categories");break}
      const c={id:uid("c"),name:b.dataset.name||"",col:PAL.find(p=>!Y.cats.some(x=>x.col===p))||PAL[Y.cats.length%PAL.length]};
      Y.cats.push(c);touch();render();
      if(!c.name){const inp=document.querySelector(`input[data-f="cname"][data-c="${c.id}"]`);if(inp)inp.focus()}break}
    case"ccol":{const c=Y.cats.find(x=>x.id===b.dataset.c);if(c&&HEX.test(b.dataset.col)){c.col=b.dataset.col;touch();render()}break}
    case"delc":armDel(b,()=>{const id=b.dataset.c;Y.cats=Y.cats.filter(c=>c.id!==id);Y.habits.forEach(h=>{if(h.cat===id)h.cat=""});touch();render()});break;
    case"install":promptInstall();break;
    case"remind":openRemind();break;
    case"rtest":testRemind();break;
    case"wm":{const w=Y.weekly.find(w=>w.id===b.dataset.w);const m=+b.dataset.m;w.months[m]=+w.months[m]?0:1;touch();render();break}
    case"wgoal":openWGoal(b.dataset.w,+b.dataset.k);break;
    case"wgsave":saveWGoal(b.dataset.w,+b.dataset.k);break;
    case"wgstep":{const i=$("#wgN");if(i)i.value=Math.max(0,Math.min(7,(parseInt(i.value,10)||0)+ +b.dataset.d));break}
    case"backup":openBackup();break;
    case"wedit":wEdit=!wEdit;render();if(wEdit){const i=document.querySelector(".wedit input");if(i)i.focus({preventScroll:true})}break;
    case"theme":setTheme(document.documentElement.dataset.theme==="light"?"dark":"light");break;
    case"closem":$("#modal").classList.add("hidden");break;
    case"copyjson":{const t=$("#bk");t.select();(navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>toast("Backup copied"),()=>{try{document.execCommand("copy");toast("Backup copied")}catch(_){toast("Select the text and copy it manually")}});break}
    case"importjson":importBackup($("#rs").value);break;
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.id==="wgN"){e.preventDefault();$('[data-act="wgsave"]')?.click();return} // Enter saves the weekly goal
  if((e.key==="Enter"||e.key===" ")&&e.target.matches(".wrow[data-w]")){e.preventDefault();e.target.click()} // weekly ticks work from the keyboard
});
document.addEventListener("input",e=>{
  const t=e.target,f=t.dataset.f;
  if(t.id==="delc"){$("#delb").disabled=t.value.trim()!=="DELETE";return}
  if(!f||!years[curY])return;const Y=years[curY];
  if(f==="hname"){const h=findH(t.dataset.h);if(h){h.name=t.value;touch()}}
  else if(f==="hgoal"){const h=findH(t.dataset.h),m=+t.dataset.m;if(!h)return;let v=parseInt(t.value,10);if(isNaN(v))v=0;v=Math.max(0,Math.min(dim(curY,m),v));h.goals[m]=v;t.parentElement.classList.toggle("zero",!v);touch();updPlanTotals()}
  else if(f==="wname"){const w=Y.weekly.find(w=>w.id===t.dataset.w);if(w){w.name=t.value;touch()}}
  else if(f==="cname"){const c=Y.cats.find(c=>c.id===t.dataset.c);if(c){c.name=t.value;touch();
    document.querySelectorAll(`select[data-f="hcat"] option[value="${c.id}"]`).forEach(o=>o.textContent=t.value||"Untitled")}}
  else if(f==="note"){Y.notes[+t.dataset.m]=t.value;touch()}
});
/* quick add from a month's tracker: the habit starts this month and runs every day from here on */
document.addEventListener("submit",e=>{
  const f=e.target;if(f.dataset.f!=="wquickadd")return;e.preventDefault();
  const Y=years[curY];if(!Y)return;const name=(f.q.value||"").trim();if(!name)return;
  const m=+f.dataset.m;
  if(Y.weekly.length>=30){toast("Up to 30 weekly habits");return}
  const same=Y.weekly.find(w=>w.name.trim().toLowerCase()===name.toLowerCase());
  if(same&&+same.months[m]){toast(`"${name}" is already on your list`);return}
  if(same){same.months=same.months.map((v,i)=>i>=m?1:+v)} // re-activate it from this month on
  else Y.weekly.push({id:uid("w"),name,months:MS.map((_,i)=>i>=m?1:0),goals:Array(WSLOTS).fill(1)});
  touch();render();toast(`Added "${name}"`);
  const inp=document.querySelector('form[data-f="wquickadd"] .qa');if(inp)inp.focus({preventScroll:true});
});
document.addEventListener("submit",e=>{
  const f=e.target;if(f.dataset.f!=="quickadd")return;e.preventDefault();
  const Y=years[curY];if(!Y)return;const name=(f.q.value||"").trim();if(!name)return;
  if(Y.habits.length>=50){toast("Up to 50 daily habits");return}
  if(Y.habits.some(h=>h.name.trim().toLowerCase()===name.toLowerCase()&&(+h.goals[+f.dataset.m]||0)>0)){toast(`"${name}" is already on your list`);return}
  const m=+f.dataset.m,n=now(),thisMonth=curY===n.y&&m===n.m;
  // in the current month the goal is the days still left (incl. today), so it stays reachable
  Y.habits.push({id:uid("h"),name,goals:MS.map((_,i)=>i<m?0:i===m&&thisMonth?dim(curY,i)-n.d+1:dim(curY,i))});
  touch();render();toast(`Added "${name}"`);
  const inp=document.querySelector(".qa");if(inp)inp.focus({preventScroll:true}); // ready for the next one
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="ysel"){setYear(+t.value);return}
  if(t.id==="rf"){const file=t.files&&t.files[0];if(file)file.text().then(txt=>{$("#rs").value=txt})}
  if(t.dataset.f==="carry"){years[curY].carry=t.value==="1";touch();toast("Saved")}
  if(t.dataset.f==="hcat"){const h=findH(t.dataset.h);if(h){h.cat=t.value;touch();render()}}
  if(t.id==="rOn")enableRemind(t.checked);
  if(t.id==="rTime"&&/^\d\d:\d\d$/.test(t.value)){const r=getRemind();r.time=t.value;setRemind(r);try{localStorage.removeItem(RKEY+"-last")}catch(e){}
    pushSync(true);
    if(r.on)toast(`Reminder moved to ${r.time}`)}
  if(t.dataset.f==="hgoal"){const v=Math.max(0,Math.min(+t.max,parseInt(t.value,10)||0));t.value=v}
});
function openBackup(){
  const m=$("#modal");m.classList.remove("hidden");
  m.innerHTML=`<div class="mbox"><h3>Backup &amp; restore</h3><p>Your tracker saves automatically. For extra safety, copy this backup text and keep it somewhere (a note, an email to yourself).</p>
  <textarea id="bk" readonly>${esc(JSON.stringify({app:"habit-tracker-dark",v:1,years}))}</textarea><div class="row"><button class="btn pri" data-act="copyjson">Copy backup</button></div><hr>
  <h3>Restore</h3><p>Paste a backup below (or choose a saved file). Years in the backup replace the same years here.</p>
  <textarea id="rs" placeholder='{"app":"habit-tracker-dark", ...}'></textarea><div class="row"><input type="file" id="rf" accept=".json,.txt,application/json,text/plain" style="font-size:11px;color:var(--mu)"><span style="flex:1"></span><button class="btn" data-act="closem">Close</button><button class="btn pri" data-act="importjson">Restore</button></div>
  ${mode==="cloud"&&user?`<hr><h3 style="color:var(--danger)">Delete account</h3>
  <p>Permanently deletes your account (${esc(user.email||"this account")}) and every year of habit data stored in the cloud. This can't be undone. Copy the backup above first if you might want your data later.</p>
  <div class="row"><input id="delc" class="dinp" placeholder="Type DELETE to confirm" autocomplete="off" aria-label="Type DELETE to confirm"><button class="btn danger" id="delb" data-act="delacct" disabled>Delete my account</button></div>`:""}</div>`;
}
async function deleteAccount(){
  if(mode!=="cloud"||!user||deleting)return;
  const btn=$("#delb"),me=user,key=lsKey();
  deleting=true;clearTimeout(timer);btn.disabled=true;btn.textContent="Deleting…";
  while(saving)await sleep(100); // let an in-flight save finish so it can't recreate a row afterwards
  const{error}=await sb.rpc("delete_my_account");
  if(user!==me){deleting=false;return}
  if(error){deleting=false;console.warn("Account deletion failed",error);
    const missing=error.code==="PGRST202"||/delete_my_account/.test(error.message||"");
    toast(missing?"Account deletion isn't set up on this server yet: run supabase/schema.sql again in Supabase. Nothing was deleted."
      :"Couldn't delete your account. Nothing was deleted; please try again.",7000);
    btn.textContent="Delete my account";btn.disabled=$("#delc").value.trim()!=="DELETE";
    if(dirty.size)flush();return}
  try{localStorage.removeItem(key);localStorage.removeItem(key+":base")}catch(e){} // no copy left on this device either
  await within(pushOff(),5000).catch(()=>{}); // the server's rows went with the account; unsubscribe this browser too
  try{await sb.auth.signOut({scope:"local"})}catch(e){}
  deleting=false;$("#modal").classList.add("hidden");showAuth();
  toast("Your account and all of its habit data have been deleted.",6000);
}
function importBackup(txt){
  try{const o=JSON.parse(txt);if(!o||typeof o.years!=="object")throw 0;let c=0;
    for(const k in o.years){if(!/^\d{4}$/.test(k))continue;const Y=norm(o.years[k]);Y.year=+k;years[k]=Y;touch(+k);c++}
    if(!c)throw 0;$("#modal").classList.add("hidden");render();toast(`Restored ${c} year${c>1?"s":""}`)}
  catch(e){toast("That doesn't look like a valid backup")}
}
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")e.currentTarget.classList.add("hidden")});

/* keep "today" fresh if the page stays open past midnight */
let lastDay=now().d;setInterval(()=>{const n=now();if(n.d!==lastDay){lastDay=n.d;if(ready&&!document.activeElement.matches("input,textarea,select"))render()}},60000);

/* ================= boot ================= */
view=defaultView();
if(!SB_ON){startGuest();if(window.HABIT_CONFIG)console.info("Supabase not configured — running in local-only mode. See README.")}
else{
  setStatus("load","Checking sign-in…");render();
  // never await Supabase calls directly inside this callback (supabase-js deadlock) — defer them
  sb.auth.onAuthStateChange((ev,session)=>setTimeout(()=>{
    if(session&&session.user)startCloud(session.user);
    else if(ev==="INITIAL_SESSION"){let g=null;try{g=localStorage.getItem(GUEST_OK)}catch(e){}g?startGuest():showAuth()}
    else if(ev==="SIGNED_OUT"&&mode==="cloud")showAuth();
  },0));
}
</script>
