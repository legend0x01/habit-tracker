name: Feature request
description: Suggest an idea for Habit Tracker
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: I keep forgetting to tick my habits in the evening…
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Describe your idea
      placeholder: A daily reminder notification at a time I choose.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I'd like to help build this
