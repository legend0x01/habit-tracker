name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug! Please don't include private data from your tracker.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the November tab
        2. Tick "Read 10 pages" for today
        3. See the streak show 0
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Were you signed in?
      options:
        - Signed in with Google
        - Using it without an account
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 131 on Windows 11 / Safari on iPhone 15
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or console errors
      description: Optional. Press F12 → Console to copy any red errors.
